<!DOCTYPE html>


<html>
    <head>
        <style>
            body{
                 text-align: center;
                 align-items: center;
                 display:flex;
                 justify-content: center;
            }

            div{
                 width:40px;
                 height:25px;
                 margin:7px;
                 text-align: center;
                 align-items: center;
                 display:Inline-block;
                 padding:15px;
                 transition:0.10s;
               
            }
       
            div:hover{
                cursor:pointer;
                background-color:rosybrown;
                scale:3.0;
                transition: 0.10s;
            }
            #div1{
                color: orange;
            }
            #div2{
                color: yellowgreen;
            }
            #div3{
                color:royalblue;
            }
            #div4{
                color: aqua;
            }
            #div5{
                color: purple;
            }
            #div6{
                color: red;
            }
            #div7{
                color: yellow;
            }
            #div8{
                color: pink;
            }
            #div9{
                color: goldenrod
            }
            #div10{
                color:brown;
            }
               
        </style>
    </head>
        <body>
           
            <div id ="div1">R</div>
            <div id ="div2">A</div>
            <div id ="div3">J</div>
            <div id ="div4">E</div>
            <div id ="div5">S</div>
            <div id ="div6">H</div>
            <div id ="div7">W</div>
            <div id ="div8">A</div>
            <div id ="div9">R</div>
            <div id ="div10">I</div>

        </body>
</html>
